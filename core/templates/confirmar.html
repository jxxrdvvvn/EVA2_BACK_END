<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Eliminación</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 36px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        .icon { width: 48px; height: 48px; background: rgba(239, 68, 68, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #f87171; font-size: 20px; font-weight: bold; margin: 0 auto 16px auto; border: 1px solid rgba(239, 68, 68, 0.2); }
        h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #f8fafc; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
        p strong { color: #f8fafc; }
        .actions { display: flex; gap: 12px; }
        button { flex: 1; padding: 11px; background: #dc2626; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #b91c1c; }
        .btn-cancel { flex: 1; padding: 11px; background: transparent; border: 1px solid #334155; color: #cbd5e1; border-radius: 6px; font-size: 14px; font-weight: 500; text-decoration: none; transition: background 0.2s; }
        .btn-cancel:hover { background: #0f172a; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">!</div>
        <h2>¿Eliminar registro?</h2>
        <p>Esta acción aplicará un borrado lógico al producto <strong>"{{ registro.nombre }}"</strong>.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="actions">
                <button type="submit">Sí, eliminar</button>
                <a href="{% url 'lista' %}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
